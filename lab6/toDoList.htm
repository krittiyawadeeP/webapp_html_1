<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            height: 300px;
            width: 300px;
            background-color: aqua;
            /* overflow: hidden; */
        }



        .todo {
            background-color: beige;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 10px;

            /* text-decoration: line-through; */
        }

        .action {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        img {
            /* background-color: blue; */
            /* margin-top: 10px; */
        }

        #inputTodo {
            width: 293px;
        }

        input[type="checkbox"]:checked {
            accent-color: green;
        }
    </style>
</head>

<body>
    <div class="container">
        <input onkeydown="addTodo(event)" id="inputTodo" type="text" placeholder="enter your task">
        <div class="todos">
            <div class="todo">
                <span style="text-decoration: line-through;">todo 1</span>

                <div class="action">
                    <input type="checkbox" checked="checked" onchange="checkTodo(this)">
                    <img src="images/delete_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" onclick="deleteAction(this)"
                        alt="bin">
                    <!-- <button id="delete" >🗑️</button> -->
                </div>


            </div>
        </div>

    </div>

    <script>
        function addTodo(event) {
            let inputTodo = document.getElementById("inputTodo").value;


            if (event.key == "Enter") {
                if (inputTodo == "")
                    return 0;

                
                    // document.getElementById("textTodo").innerText = inputTodo;

                    let newDiv = document.createElement("div");
                    newDiv.className = "todo";

                    newDiv.innerHTML = `
            <span>${inputTodo}</span>
            <div class="action">
                <input type="checkbox" onchange="checkTodo(this)" >

                <img 
                    src="images/delete_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png"
                    onclick="deleteAction(this)"
                    alt="bin"
                >
            </div>
        `;

                    document.getElementsByClassName("todos")[0].appendChild(newDiv);
                    document.getElementById("inputTodo").value = "";
                
            }
        }

        function checkTodo(checkbox) {
            //  checkbox
            //    ↓ parentElement
            // .action
            //    ↓ parentElement
            // .todo
            //    ↓ querySelector("span")
            // // todo 1
            let todo = checkbox.parentElement.parentElement;
            let textTitle = todo.querySelector("span");

            if (checkbox.checked) {
                textTitle.style.textDecoration = "line-through";
            }
            else {
                textTitle.style.textDecoration = "none";
            }

        }


        function deleteAction(thisTodo) {
            let thatTodo = thisTodo.parentElement.parentElement;
            thatTodo.remove();
            //or you can 
            //thisTodo.parentElement.parentElement.remove();

        }

    </script>

</body>

</html>
