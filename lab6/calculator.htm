<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>


    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            background-color: rgb(255, 144, 225);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        input{
            font-size: 40px;
            width: 100%;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 15px;
            border: 1px black solid;

        }

        .container{
            background-color: rgb(236, 244, 217);
            width: 310px;
            height: 450px;
            padding: 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border-radius: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
        }
        
        .buttons{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(5,45px);
            gap: 10px;
        }

        .equal_button{
            grid-column: span 2;
            background-color: palevioletred;
            border-radius: 15px;
            border: 1px black solid;
        }

        .operate_button{
            background-color: rgb(234, 234, 164);
            border-radius: 15px;
            border: 1px black solid;
        }

        button{
            background-color: rgb(141, 199, 252);
            border-radius: 15px;
            border: 1px black solid;
            transition: 0.2s; 
        }

        .c{
           background-color: rgb(242, 160, 60);

        }

        button:hover{
            background-color: rgb(36, 123, 205);
            color: aliceblue;
            transform: translateY(-2px);
            
        }

        .operate_button:hover{
            background-color: rgb(230, 218, 113);
            color: black;
            transform: translateY(-2px);
            
        }

        .equal_button:hover{
            background-color: rgb(227, 81, 130);
            color: aliceblue;
            transform: translateY(-2px);
        }

        .c:hover{
            background-color: rgb(225, 111, 30);
            color: aliceblue;
            transform: translateY(-2px);  
        }



        button:active{
            transform: scale(0.9);
        }



    </style>
</head>


<body>
    <div class="container">
        <input type="text" id="displayCon">
        <div class="buttons">
            <button onclick="add_to_display('+')" class="operate_button" >+</button>
            <button onclick="add_to_display('-')" class="operate_button">-</button>
            <button onclick="add_to_display('*')" class="operate_button">x</button>
            <button onclick="add_to_display('/')" class="operate_button">/</button>
            <button onclick="add_to_display('7')"  >7</button>
            <button onclick="add_to_display('8')"  >8</button>
            <button onclick="add_to_display('9')" >9</button>
            <button onclick="add_to_display('4')" >4</button>
            <button onclick="add_to_display('5')" >5</button>
            <button onclick="add_to_display('6')" >6</button>
            <button onclick="add_to_display('1')" >1</button>
            <button onclick="add_to_display('2')" >2</button>
            <button onclick="add_to_display('3')" >3</button>
            <button onclick="add_to_display('0')" >0</button>
            <button onclick="add_to_display('.')" >.</button>
            <button onclick="clearDisplay()" class="c">c</button>
            <button onclick="show()" class="equal_button">=</button>
        </div>
    </div>


    <script>
        function add_to_display(newValue){
            document.getElementById("displayCon").value += newValue;


        }

        function show() {
            let express = document.getElementById("displayCon").value;
            let result = eval(express);
            document.getElementById("displayCon").value = result;
            //if it is input , use ".value"
            //if h1, p ,div , use ".innerHTML" (for style <p>dfv<p>) or ".innerText (for only text)"
            //must try
            
        }

        function clearDisplay() {
            document.getElementById("displayCon").value = "";
            //dont use name as "clear"
        }



    </script>
    
</body>
</html>
