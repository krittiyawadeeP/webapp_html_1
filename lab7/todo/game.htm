<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Game</title>
</head>

<style>

    body{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: monospace;
    }
    #emtyBox {
        display: flex;
        flex-direction: row;
        gap: 20px;
        margin: 10px;
    }

    .chars {
        padding: 20px;
        background-color: blanchedalmond;
        cursor: grab;
        user-select: none;
    }

    #chars {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin-top: 20px;
    }

    .slot {
        width: 60px;
        height: 60px;
        border: 2px dashed gray;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f9f9f9;
    }
    
    /* สไตล์เพิ่มเติมเมื่อนำตัวอักษรมาใส่ในกล่อง */
    .slot .chars {
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: aqua;
    }
</style>

<body>
    <h1>Vocabulary Game</h1>
    <p>time : <span id="time">5</span></p>
    <p>score : <span id="score">0</span></p>
    <p>round : <span id="round">1</span></p>
    <p>word : <span id="word"> </span></p>
    
    <div id="emtyBox"></div>
    <div id="chars"></div>

    <br>
    <!-- แก้ไขปุ่มรีเซ็ตให้เรียกฟังก์ชันตั้งต้นใหม่ได้ -->
    <button onclick="resetGame()">resetGame</button>

    <script>
        // เพื่อให้โค้ดนี้ทดสอบเล่นได้ทันที สมมติคำศัพท์ให้หากใน localStorage ว่างเปล่า
        let ArrayWords = JSON.parse(localStorage.getItem("ArrayWords")) || ["CAT", "DOG", "BIRD", "FISH", "FROG"];
        let round = 0;
        let remainingWord = []; 
        let time = 5;
        let currentWord = "";
        let score = 0;
        let timer;

        if (ArrayWords.length == 0) {
            alert("no vocab found");
            window.location.href = "gameVocab1.htm";
        }

        startGame();

        function startGame() {
            round++;
            if (round > 5) {
                clearInterval(timer);
                alert("Game Over! Your total score is: " + score);
                return;
            }
            
            // แก้ไขจุดที่ 4: อัปเดตเลขรอบไปแสดงบนหน้าจอ HTML
            document.getElementById("round").innerText = round;

            if (remainingWord.length == 0) {
                remainingWord = [...ArrayWords];
            }

            let randomIndex = Math.floor(Math.random() * remainingWord.length);
            
            // แก้ไขจุดที่ 1: เปลี่ยนจาก ArrayWords เป็น remainingWord เพื่อดึงคำศัพท์ให้สัมพันธ์กับการลบออก
            currentWord = remainingWord[randomIndex];

            remainingWord.splice(randomIndex, 1);
            document.getElementById("word").innerText = currentWord;

            creatLetters();
            creatAnswer();
            
            // แก้ไขจุดที่ 2: รีเซ็ตเวลากลับมาเป็น 5 วินาทีทุกครั้งก่อนเริ่มนับใหม่
            time = 5; 
           // startTime();
        }

        function startTime() {
            clearInterval(timer);
            document.getElementById("time").innerText = time;

            timer = setInterval(function () {
                time--;
                document.getElementById("time").innerText = time;

                if (time <= 0) {
                    clearInterval(timer);
                    alert("Time out!");
                    startGame();
                }
            }, 1000);
        }

        function creatLetters() {
            let letters = document.getElementById("chars");
            letters.innerHTML = "";

            let charArray = currentWord.split("");
            charArray.sort(() => Math.random() - 0.5);

            charArray.forEach(function (char, index) {
                let newLetter = document.createElement("div");
                newLetter.className = "chars";
                newLetter.innerText = char;
                newLetter.id = "char" + index;
                newLetter.draggable = true;
                newLetter.ondragstart = drangStartHandler;
                letters.appendChild(newLetter);
            });
        }

        function creatAnswer() {
            let emtyBox = document.getElementById("emtyBox");
            emtyBox.innerHTML = "";

            for (let i = 0; i < currentWord.length; i++) {
                let slot = document.createElement("div");
                slot.className = "slot";
                slot.ondrop = dropHandler;
                slot.ondragover = drangOverHandler;
                emtyBox.appendChild(slot);
            }
        }

        function drangStartHandler(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drangOverHandler(ev) {
            ev.preventDefault();
        }

        function dropHandler(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);

            // แก้ไขจุดที่ 3: ตรวจเช็กเพื่อให้แน่ใจว่าวางลงบนกล่องเป้าหมาย (slot) และกล่องนั้นยังไม่มีลูกอยู่ข้างใน
            if (ev.target.classList.contains("slot") && ev.target.children.length === 0) {
                ev.target.appendChild(draggedElement);
                checkAnswer();
            }
        }

        function checkAnswer() {
            let slots = document.getElementById("emtyBox").children;
            let answer = "";

            for (let slot of slots) {
                if (slot.children.length == 0) return; // ถ้ายังมีช่องว่างอยู่ ให้ข้ามไปก่อนยังไม่ต้องตรวจ
                answer += slot.children[0].innerText;
            }

            if (answer === currentWord) {
                score++;
                document.getElementById("score").innerText = score;
            }

            clearInterval(timer);

            setTimeout(function () {
                startGame();
            }, 800);
        }

        // ฟังก์ชันเพิ่มเติมสำหรับปุ่มกดรีเซ็ตเริ่มเกมใหม่ทั้งหมด
        function resetGame() {
            round = 0;
            score = 0;
            remainingWord = [];
            document.getElementById("score").innerText = score;
            startGame();
        }
    </script>
</body>

</html>
