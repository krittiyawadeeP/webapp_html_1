<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(255, 169, 249);

            display: flex;
            /* flex-direction: column; */
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            background-color: rgb(236, 244, 217);
            width: 310px;
            height: 450px;
            padding: 40px;

            /* display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; */

            border-radius: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
        }

        h1 {
            text-align: center
        }

        button {
            display: block;
            width: 80px;
            padding: 10px;
            background-color: palevioletred;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            margin-top: 20px;
        }

        button:hover {
            background-color: rgb(0, 119, 255);
            color: aliceblue;
        }

        .radio-group {
            margin-top: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 30px;
        }

        .radio-group>label {
            /* margin-right: 20px; */
            /* background-color: blueviolet; */
        }

        form {
            display: flex;
            flex-direction: column;
            /* row-gap: 30px; */
            /* background-color: brown; */
        }

        form>input,
        textarea {
            width: 100%;
            margin: 5px;
            margin-left: 0px;
            border: none;
            border-bottom: solid black 2px;

            padding: 15px 0;
            background: transparent;
        }

        form>input::placeholder,
        textarea::placeholder {
            padding-left: 3px;
            color: black;
            font-family: 'Poppins', sans-serif;
        }

        textarea {
            height: 90px;
        }
    </style>

</head>

<body>
    <div class="container">
        <h1>contact us</h1>

        <div class="radio-group">

            <label for="">
                <input type="radio" checked> say Hi
            </label>

            <label for="">
                <input type="radio"> get a queue
            </label>


        </div>


        <form action="" method="post">
            <input type="text" placeholder="your name">
            <input type="email" placeholder="your gmail">
            <textarea name="your message" id="message" placeholder="your message"></textarea>
            <button type="submit">submit</button>

        </form>
        <!-- </form> -->

    </div>

</body>

</html>
