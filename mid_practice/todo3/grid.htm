<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            background-color: aqua;
            display: grid;
            grid-template-rows: 100px 100px 50px;
            grid-template-columns: 100px 150px 100px;
        }

        .container > div{
            background-color: beige;
            border: 1px solid black;
        }

        .b1{
            grid-row: 1 / 4;
        }

        .b2{
            grid-column: 2 / 4;
        }

        .b3{
            grid-row: 2 / 4;
            grid-column: 2 / 4;
        }
    </style>
</head>


<body>
    <div class="container">
        <div class="b1">b1</div>
        <div class="b2">b2</div>
        <div class="b3">b3</div>
    </div>
    
</body>
</html>
