<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: flex;
            flex-direction: column;
        }

        .mid{
            display: flex;
            flex-direction: row;
        }

        header {
            background-color: aqua;
            height: 50px;
        }


        nav {
            background-color: blanchedalmond;
            height: 50px;
            width: 30%;

        }

        main {
            background-color: blue;
            width: 40%;
            height: 50px;
        }

        aside {
            background-color: red;
            width: 30%;
            height: 50px;
        }

        footer {
            background-color: blueviolet;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>header</header>

        <div class="mid">
            <nav>nav</nav>
            <main>main</main>
            <aside>aside</aside>
        </div>

        <footer>footer</footer>
    </div>


</body>

</html>
