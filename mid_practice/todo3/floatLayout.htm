<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    header {
        background-color: aqua;
        height: 50px;
    }


    nav {
        background-color: blanchedalmond;
        float: left;
        height: 50px;
        width: 30%;

    }

    main {
        background-color: blue;
        float: left;
        width: 40%;
        height: 50px;
    }

    aside {
        background-color: red;
        float: right;
        width: 30%;
        height: 50px;
    }

    footer {
        background-color: blueviolet;
        clear: both;
        height: 50px;
    }
</style>

<body>


    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <aside>aside</aside>
    <footer>footer</footer>



</body>

</html>
