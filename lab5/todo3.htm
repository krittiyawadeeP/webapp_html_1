<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="count">0</h1>
    <button onclick="up()">count up</button>
    <button onclick="down()">count down</button>
    
    <script>
        let number =0;

        function up(){
            number++;
            document.getElementById("count").innerText= number;
        }

        function down(){
            number--;
            document.getElementById("count").innerText = number;
        }
    </script>
</body>
</html>
