<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3_2 Home</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        main {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #4b5563;
            font-size: 16px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
        }

        .menu a {
            display: block;
            min-height: 120px;
            padding: 18px;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            background: #ffffff;
            color: #1f2937;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .menu a:hover {
            transform: translateY(-3px);
            border-color: #2563eb;
            box-shadow: 0 12px 26px rgba(31, 41, 55, 0.14);
        }

        .menu strong {
            display: block;
            margin-bottom: 8px;
            font-size: 20px;
            color: #2563eb;
        }

        .menu span {
            display: block;
            line-height: 1.5;
            color: #4b5563;
        }
    </style>
</head>

<body>
    <main>
        <h1>หน้าแรก Lab 3_2</h1>
        <p class="subtitle">เลือกหน้าที่ต้องการเปิด</p>

        <nav class="menu" aria-label="Lab 3_2 pages">
            <a href="calculator.htm">
                <strong>Calculator</strong>
                <span>เปิดหน้าเครื่องคิดเลข</span>
            </a>
            <a href="chat_index.htm">
                <strong>Chat</strong>
                <span>เปิดหน้าตัวอย่างแชต</span>
            </a>
            <a href="pageFaceBook.htm">
                <strong>Facebook Page</strong>
                <span>เปิดหน้าตัวอย่าง Facebook</span>
            </a>
        </nav>
    </main>
</body>

</html>
